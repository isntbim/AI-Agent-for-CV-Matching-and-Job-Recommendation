# The demo stack, one container per service:
#   frontend (Next.js, :3000) -> api (FastAPI + LangGraph, :8000, Swagger at /docs) -> ollama (GPU: qwen-v4 + qwen3-embedding)
#                                                                                -> PostgreSQL + pgvector (JD vectors, runs + feedback)
#   prometheus (:9090) scrapes the API; grafana (:3001) shows the dashboard.
#
# Database: docker/.env sets VECTOR_DSN and HISTORY_DSN to a managed PostgreSQL with pgvector (the defence setup:
# Azure capstonedb1, database cvmatch). Without them, add --profile local-db: vectordb and historydb run as containers.
#
# Two ways to run the GPU part, from the repo root (images: docker compose -f docker/docker-compose.yml pull, or up --build):
#  a) GPU in the cloud (the defence setup; this machine needs no GPU): Ollama runs on a Runpod serverless endpoint
#     (docker/ollama-serverless/). Put in docker/.env:  OLLAMA_URL=https://<endpoint-id>.api.runpod.ai
#                                                       OLLAMA_API_KEY=<Runpod API key, restricted to that endpoint>
#     docker compose -f docker/docker-compose.yml up -d
#  b) Local GPU (Linux + NVIDIA container toolkit): MODELS_DIR=/path/to/models
#     docker compose -f docker/docker-compose.yml --profile local-gpu up -d
#     MODELS_DIR holds qwen-v4-q4_K_M.gguf (scripts/qwen_build_ollama.py); ollama-init loads it into Ollama once.
# The corpus, retrieval index and extraction cache are mounted from the host's output/ (git-ignored: personal data).
# The local-db containers are reachable only inside the stack; set PG_PASSWORD to change their password.
services:
  frontend:
    image: ghcr.io/isntbim/ai-agent-for-cv-matching-and-job-recommendation/frontend:latest
    build:
      context: ../frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    image: ghcr.io/isntbim/ai-agent-for-cv-matching-and-job-recommendation/api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # docker/.env can point both at a managed PostgreSQL (with pgvector) instead of the two containers below
      VECTOR_DSN: ${VECTOR_DSN:-postgresql://postgres:${PG_PASSWORD:-cvmatch}@vectordb:5432/vectors}
      HISTORY_DSN: ${HISTORY_DSN:-postgresql://postgres:${PG_PASSWORD:-cvmatch}@historydb:5432/history}
    ports:
      - "8000:8000"
    volumes:
      - ../output:/app/output                          # corpus_v2, index_v2, JD texts, extraction cache (written)
      - ../.cache/retrieval/embeddings:/app/.cache/retrieval/embeddings   # query-embedding cache (written)
      - retrieval-models:/app/.cache/retrieval/huggingface                 # bge-m3 + reranker, downloaded on first start
      - hf-cache:/app/.cache/hf                        # Qwen2.5 tokenizer, downloaded on first start
    depends_on:
      ollama-init:
        condition: service_completed_successfully
        required: false   # only with --profile local-gpu
      vectordb:
        condition: service_healthy
        required: false   # only with --profile local-db
      historydb:
        condition: service_healthy
        required: false

  ollama:
    image: ollama/ollama:0.40.14
    profiles: [local-gpu]
    environment:
      OLLAMA_NUM_PARALLEL: "1"   # 12 GB GPU: qwen-v4 (6.6 GB) and the embedder (3.1 GB) both stay loaded
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # One-shot: puts the two models into Ollama the first time (skipped once they are there), then exits.
  ollama-init:
    image: ollama/ollama:0.40.14
    profiles: [local-gpu]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
      - ./ollama/Modelfile.qwen-v4:/Modelfile.qwen-v4:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (ollama show qwen-v4 > /dev/null 2>&1 || ollama create qwen-v4 -f /Modelfile.qwen-v4) &&
        (ollama show qwen3-embedding:4b > /dev/null 2>&1 || ollama pull qwen3-embedding:4b)
    depends_on:
      ollama:
        condition: service_healthy

  vectordb:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: [local-db]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cvmatch}
      POSTGRES_DB: vectors
    volumes:
      - vectordb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "vectors"]
      interval: 5s
      retries: 20

  historydb:
    image: postgres:17.5-alpine
    profiles: [local-db]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cvmatch}
      POSTGRES_DB: history
    volumes:
      - historydb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "history"]
      interval: 5s
      retries: 20

  # Monitoring: Prometheus scrapes the API's /metrics; Grafana (http://localhost:3001, admin / admin on first login)
  # opens with the provisioned "CV Match service" dashboard.
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cv-match.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"   # the front end has 3000
    depends_on:
      - prometheus

volumes:
  retrieval-models:
  ollama:
  vectordb:
  historydb:
  hf-cache:
