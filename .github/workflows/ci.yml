# CI: lint + unit tests on every push and pull request; CD: build the API image and push it to GitHub Container Registry
# on main. The models (Ollama) and all data stay outside the image (see docker/Dockerfile), so this needs no GPU or secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:  # the history and vector-store tests run on PostgreSQL + pgvector too (tests/unit/test_api.py, test_pgvector_store.py)
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PG_TEST_DSN: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements-api.txt
      - name: Install
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r docker/requirements-api.txt openpyxl==3.1.5 pgvector==0.5.0 "psycopg[binary]==3.3.5" pytest==9.2.0 ruff==0.14.0
      - name: Lint (syntax errors and undefined names)
        run: ruff check src scripts tests --select E9,F63,F7,F82
      - name: Unit tests
        # tests that need the git-ignored gold data skip themselves; test_ats_silver_eda needs pandas and local data
        run: pytest tests/unit -q --ignore tests/unit/test_ats_silver_eda.py

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/api
          docker build -f docker/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE
      - name: Build and push the serverless Ollama worker image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/ollama-serverless
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest docker/ollama-serverless
          docker push --all-tags $IMAGE
      - name: Build and push the frontend image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/frontend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest frontend
          docker push --all-tags $IMAGE
